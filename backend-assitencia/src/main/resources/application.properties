spring.application.name=backend-assitencia
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}

api.security.token.secret=${PALAVRA_SECRETA}
api.security.expiration.time=${JWT_EXPIRATION_TIME:3600}
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

# Configurações de Criptografia (Lê do .env ou usa um valor padrão de desenvolvimento)
app.criptografia.senha=${CRYPTO_SENHA:senha-padrao-desenvolvimento-123}
app.criptografia.salt=${CRYPTO_SALT:5c0744940b5c369b}
app.criptografia.chave-hmac=${CRYPTO_CHAVE_HMAC:chave-hmac-padrao-desenvolvimento-456}
